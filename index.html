<script>
const click=()=>document.getElementById("click").play();

let activeTank=1;
let lastPot=null;
let reconnectDelay=1000;
let reconnectTimer=null;
let connected=false;

const connEl=document.getElementById("conn");

function setConn(state){
if(state==="connecting") connEl.innerHTML="🟡 CONNECTING";
if(state==="online") connEl.innerHTML="🟢 ONLINE";
if(state==="offline") connEl.innerHTML="🔴 OFFLINE";
if(state==="reconnecting") connEl.innerHTML="🟠 RECONNECTING";
}

let client;

function connectMQTT(){
setConn("connecting");

client=new Paho.MQTT.Client(
"broker.hivemq.com",
8884,
"web_"+Math.random()
);

client.onConnectionLost=()=>{
connected=false;
setConn("offline");
scheduleReconnect();
};

client.onMessageArrived=m=>rx(m.destinationName,m.payloadString);

client.connect({
useSSL:true,
timeout:5,
onSuccess:()=>{
connected=true;
reconnectDelay=1000;
setConn("online");
subscribeTopics();
},
onFailure:()=>{
connected=false;
setConn("offline");
scheduleReconnect();
}
});
}

function scheduleReconnect(){
if(reconnectTimer) return;
setConn("reconnecting");
reconnectTimer=setTimeout(()=>{
reconnectTimer=null;
connectMQTT();
reconnectDelay=Math.min(reconnectDelay*2,30000);
},reconnectDelay);
}

function subscribeTopics(){
[
"83095/esp1/pot","83095/esp2/power",
"83095/esp1/MP","83095/esp1/GP",
"AVS/esp1/time","AVS/esp2/time",
"AVS/esp1/PW","AVS/esp2/PW",
"83095/esp1/relay3","83095/esp1/relay4",
"83095/esp2/relay2","83095/esp2/relay3","83095/esp2/relay4"
].forEach(t=>client.subscribe(t));
}

function pub(t,m,r=false){
if(!connected) return;
let msg=new Paho.MQTT.Message(m);
msg.destinationName=t;
msg.retained=r;
client.send(msg);
}

function rx(t,m){
if(t==="83095/esp1/pot"){
if(lastPot!==m){
heart.classList.add("heart");
setTimeout(()=>heart.classList.remove("heart"),600);
}
lastPot=m;
}

if(t==="AVS/esp1/time")
alarm1.style.display=/^\d\d:\d\d$/.test(m)?"block":"none";

if(t==="AVS/esp2/time")
alarm2.style.display=/^\d\d:\d\d$/.test(m)?"block":"none";

if(t==="83095/esp2/power") pwr2.innerHTML=m;
if(t==="83095/esp1/MP") mp.innerHTML=m;

if(t==="83095/esp1/GP"){
gp.innerHTML=m;
gp.classList.toggle("generator",m==="ON");
}
}

/* start mqtt */
connectMQTT();

/* online/offline browser events */
window.addEventListener("offline",()=>{
setConn("offline");
});

window.addEventListener("online",()=>{
if(!connected) connectMQTT();
});
</script>
